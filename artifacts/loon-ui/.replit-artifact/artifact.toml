kind = "web"
previewPath = "/"
title = "Loon Proxy Dashboard"
version = "1.0.0"
id = "artifacts/loon-ui"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24404

[services.development]
run = "pnpm --filter @workspace/loon-ui run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/loon-ui", "run", "build" ]
publicDir = "artifacts/loon-ui/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24404"
BASE_PATH = "/"
